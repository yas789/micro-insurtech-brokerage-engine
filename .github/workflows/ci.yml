name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required docs
        run: sh scripts/check-docs.sh

  dotnet:
    name: .NET Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore core-engine/MicroInsurTech.CoreEngine.csproj

      - name: Build
        run: dotnet build core-engine/MicroInsurTech.CoreEngine.csproj --configuration Release --no-restore

  php:
    name: PHP Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate Composer metadata
        working-directory: php-gateway
        run: composer validate --strict --no-check-lock

      - name: Check PHP syntax
        run: |
          find php-gateway -name '*.php' -print -exec php -l {} \;
