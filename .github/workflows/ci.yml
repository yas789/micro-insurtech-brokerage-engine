name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required docs
        run: sh scripts/check-docs.sh

  dotnet:
    name: .NET Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore core-engine/MicroInsurTech.CoreEngine.csproj

      - name: Restore tests
        run: dotnet restore core-engine-tests/MicroInsurTech.CoreEngine.Tests.csproj

      - name: Build
        run: dotnet build core-engine/MicroInsurTech.CoreEngine.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build core-engine-tests/MicroInsurTech.CoreEngine.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test core-engine-tests/MicroInsurTech.CoreEngine.Tests.csproj --configuration Release --no-build --verbosity normal

  php:
    name: PHP Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate Composer metadata
        working-directory: php-gateway
        run: composer validate --strict --no-check-lock

      - name: Install PHP dependencies
        working-directory: php-gateway
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check PHP syntax
        run: |
          find php-gateway -name '*.php' -print -exec php -l {} \;

      - name: Run PHP tests
        working-directory: php-gateway
        run: composer test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  integration:
    name: Quote Journey Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full quote journey integration
        env:
          SQLSERVER_SA_PASSWORD: Change_this_password_123!
        run: python3 scripts/run-integration.py
